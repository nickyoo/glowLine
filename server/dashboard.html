<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glowline dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #0b0e13; color: #e6e9ef;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    padding: 32px; max-width: 720px; margin: 0 auto;
  }
  h1 { font-size: 20px; letter-spacing: 3px; }
  .sub { color: #5b6472; font-size: 12px; margin: 4px 0 20px; }
  .conn { font-size: 11px; color: #5b6472; margin-bottom: 20px; }
  .conn.ok { color: #34d399; }
  .conn.bad { color: #ff3b30; }
  .pill {
    display: inline-block; padding: 10px 24px; border-radius: 999px;
    font-size: 22px; font-weight: 700; letter-spacing: 3px;
    margin-bottom: 28px; transition: background .3s, box-shadow .3s;
  }
  h2 { font-size: 12px; color: #8b93a1; letter-spacing: 2px; margin-bottom: 12px; }
  .sites { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
  .site { background: #12161d; border: 1px solid #1e2530; border-radius: 10px; padding: 14px; }
  .site .name { font-size: 12px; color: #8b93a1; margin-bottom: 8px; }
  .site .state { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
  .site .age { font-size: 11px; color: #5b6472; margin-top: 6px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
  button {
    background: #1a2029; color: #e6e9ef; border: 1px solid #2a3340;
    border-radius: 8px; padding: 10px 16px; font: inherit; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #232b36; }
  button.active { border-color: #34d399; color: #34d399; }
  .colors { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 28px; }
  .color-row {
    display: flex; align-items: center; gap: 12px;
    background: #12161d; border: 1px solid #1e2530; border-radius: 10px; padding: 10px 14px;
  }
  .color-row label { font-size: 13px; letter-spacing: 1px; flex: 1; }
  input[type=color] { width: 44px; height: 32px; border: none; background: none; padding: 0; cursor: pointer; }
  .foot { color: #5b6472; font-size: 11px; }
</style>
</head>
<body>
  <h1>GLOWLINE</h1>
  <div class="sub">ambient lid-glow control</div>
  <div class="conn" id="conn">connecting…</div>
  <div><span class="pill" id="pill">IDLE</span></div>

  <h2>SITES</h2>
  <div class="sites" id="sites"></div>

  <h2>PREVIEW GLOW</h2>
  <div class="row" id="preview-row">
    <button data-state="BUSY">Busy</button>
    <button data-state="WAITING">Waiting</button>
    <button data-state="ERROR">Error</button>
    <button data-state="IDLE">Idle</button>
    <button id="pause-btn">Pause</button>
  </div>

  <h2>COLORS</h2>
  <div class="colors" id="colors"></div>

  <div class="foot">server ws://localhost:8765 · dashboard http://localhost:8766 · colors persist to config.json</div>

<script>
const STATES = ["BUSY", "WAITING", "ERROR", "IDLE"];
const $ = (id) => document.getElementById(id);

async function api(path, body) {
  const opts = body
    ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
    : {};
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

let colorsBuilt = false;
function buildColors(colors) {
  const wrap = $("colors");
  wrap.innerHTML = "";
  for (const s of STATES) {
    const row = document.createElement("div");
    row.className = "color-row";
    const label = document.createElement("label");
    label.textContent = s;
    const inp = document.createElement("input");
    inp.type = "color";
    inp.value = colors[s] || "#000000";
    inp.addEventListener("change", () => {
      api("/api/config", { colors: { [s]: inp.value } }).catch(() => {});
    });
    row.appendChild(label);
    row.appendChild(inp);
    wrap.appendChild(row);
  }
  colorsBuilt = true;
}

function render(d) {
  const pill = $("pill");
  const label = d.paused ? "PAUSED" : d.aggregate + (d.overriding ? " · PREVIEW" : "");
  pill.textContent = label;
  const bg = d.paused ? "#1a2029" : d.colors[d.aggregate];
  pill.style.background = bg;
  pill.style.boxShadow = d.paused ? "none" : `0 0 32px ${bg}66`;
  pill.style.color = (d.aggregate === "IDLE" || d.paused) ? "#e6e9ef" : "#0b0e13";

  const sites = $("sites");
  sites.innerHTML = "";
  for (const name of ["chatgpt", "claude", "gemini"]) {
    const s = d.sites[name];
    const state = s ? s.state : "IDLE";
    const card = document.createElement("div");
    card.className = "site";
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = d.colors[state];
    const st = document.createElement("div");
    st.className = "state";
    st.appendChild(dot);
    st.appendChild(document.createTextNode(state));
    card.innerHTML = `<div class="name">${name}</div>`;
    card.appendChild(st);
    const age = document.createElement("div");
    age.className = "age";
    age.textContent = s ? s.age_s + "s ago" : "no signal";
    card.appendChild(age);
    sites.appendChild(card);
  }

  const pb = $("pause-btn");
  pb.textContent = d.paused ? "Resume" : "Pause";
  pb.classList.toggle("active", d.paused);

  if (!colorsBuilt) buildColors(d.colors);
}

async function poll() {
  try {
    const d = await api("/api/state");
    const c = $("conn");
    c.textContent = "● live";
    c.className = "conn ok";
    render(d);
  } catch {
    const c = $("conn");
    c.textContent = "○ server not running";
    c.className = "conn bad";
  }
  setTimeout(poll, 1000);
}

$("preview-row").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.id === "pause-btn") {
    api("/api/pause", { paused: b.textContent === "Pause" }).then(poll).catch(() => {});
  } else {
    api("/api/preview", { state: b.dataset.state, seconds: 4 }).catch(() => {});
  }
});

poll();
</script>
</body>
</html>
